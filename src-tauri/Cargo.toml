[package]
name = "libellus"
version = "0.1.0"
description = "A local-first developer workspace for notes, snippets and utilities."
authors = ["libellus"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "libellus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
